# Render 用（検証環境）。本番は AWS Lightsail + MySQL + S3 を参照: docs/aws-lightsail-deploy.md
services:
  - type: web
    name: prum-ai-academy
    runtime: docker
    rootDir: api-server
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_SEEDER
        value: "false"
      - key: DB_FRESH
        value: "false"
